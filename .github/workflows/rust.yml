name: Build

# Triggers the workflow on push or pull request events (for any branch in a repository)
on: [ merge_group, push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # TODO once the x86 dependency for the benchmark is gone, we can add
        # macos-latest.
        runs-on: [ ubuntu-latest, windows-latest ]
        # TODO also test MSRV and stable once the crate builds there
        rust: [ nightly ]
        include:
          - components: ""
          - rust: nightly
            components: miri
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - if: matrix.rust == 'nightly'
        name: Test with Miri
        run: cargo miri test
      - run: cargo bench --bench allocator --features bench --no-run
      - run: cargo run --example minimal

  build_nostd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO also test MSRV and stable once the crate builds there
        rust: [ nightly ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build no_std target
        run: cargo build --target thumbv7em-none-eabihf

  style_checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [ nightly ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Rustdoc
        run: cargo doc --no-deps --document-private-items
