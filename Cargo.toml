[package]
name = "simple-chunk-allocator"
description = """
A simple `no_std` allocator that manages fixed-size chunks. It is useful for
basic `no_std` binaries with a fixed static heap, without paging or page tables.
"""
version = "0.1.6"
edition = "2024"
# nightly 1.87
# rust-version = "1.87.0"
authors = [
    "Philipp Schuster <phip1611@gmail.com>"
]
keywords = ["allocator", "memory"]
categories = ["memory-management", "no-std"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/phip1611/simple-chunk-allocator"
repository = "https://github.com/phip1611/simple-chunk-allocator"
documentation = "https://docs.rs/simple-chunk-allocator"
exclude = [
    ".github"
]

# This affects at least the example build with this crate. I don't know if it
# affects builds where this crate is a dependency.
# crate when other crates use it as dependency. I don't think so.
[profile.release]
# https://doc.rust-lang.org/cargo/reference/profiles.html
# Changes for maximum performance: only differences to default settings
codegen-units = 1
lto = true

[dependencies]
libm = "0.2"
log = "0.4"
spin = "0.12.2"

[dev-dependencies]
rand = "0.10"
x86 = "0.52"
# for benchmarking
linked_list_allocator = { version = "0.10", features = ["use_spin"] }
