[package]
name = "simple-chunk-allocator"
description = """
A `no_std` allocator that manages fixed-size chunks in a single caller-provided memory region, with
optional support for the unstable `allocator_api`.
"""
version = "0.1.6"
edition = "2024"
rust-version = "1.85"
authors = [
    "Philipp Schuster <phip1611@gmail.com>"
]
keywords = ["allocator", "memory"]
categories = ["memory-management", "no-std"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/phip1611/simple-chunk-allocator"
repository = "https://github.com/phip1611/simple-chunk-allocator"
documentation = "https://docs.rs/simple-chunk-allocator"
exclude = [
    ".github"
]

# This affects at least the example build with this crate. I don't know if it
# affects builds where this crate is a dependency.
# crate when other crates use it as dependency. I don't think so.
[profile.release]
# https://doc.rust-lang.org/cargo/reference/profiles.html
# Changes for maximum performance: only differences to default settings
codegen-units = 1
lto = true

[features]
# Integration with the unstable `allocator_api` (`AllocatorApiGlue`).
# Requires a nightly toolchain.
unstable = []

[dependencies]
log = "0.4"
spin = "0.12.2"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
linked_list_allocator = { version = "0.10", default-features = false }
talc = "5.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

# These targets use the nightly-only allocator_api; cargo skips them unless
# the `unstable` feature is enabled.
[[example]]
name = "minimal"
required-features = ["unstable"]

[[test]]
name = "allocator_api"
required-features = ["unstable"]

# Criterion provides `main`, so the default libtest harness must stay out of
# the way.
[[bench]]
name = "bench"
harness = false
